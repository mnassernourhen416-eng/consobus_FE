<h2>Gestion des trajets</h2>



<div class="app-approval-card" style="display:grid; grid-template-columns: repeat(4,1fr); gap:20px;">
    @for (bus of listBus(); track $index) {
    <!-- filter -->
    <div class="flex flex-col gap-2 justify-center items-center">
        <app-bus-container [matricule]="bus.matricule" [bus]="bus"
            (busClicked)="showCreateTrajetDialog($event)"></app-bus-container>
        @if(bus.etat === "EnService") {
        <div>
            <p-button label="Arriver" icon="pi pi-check" severity="primary"
                (click)=" showArriverDialog(bus)"></p-button>
        </div>
        }

    </div>

    }


</div>
@if( currentUser?.role!='Directeur') {
<p-dialog header="Terminer trajet, Bus:  {{selectedBus?.matricule}}" [modal]="true" [(visible)]="arriverDialog"
    [style]="{ width: '25rem' }">

    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="arriverDialog = false" />
        <p-button label="Terminer" (click)="TerminerTrajet()" />
    </div>
</p-dialog>}
@if( currentUser?.role!='Directeur') {
<p-dialog header="Ajouter un trajet:  {{selectedBus?.matricule}}" [modal]="true" [(visible)]="displayCreateDialog"
    [style]="{ width: '25rem' }" (visibleChange)="displayUpdateDialog.set($event)">

    <div class="flex items-center gap-4 mb-8">
        <label for="date" class="font-semibold w-24">Date</label>
        <input pInputText type="datetime-local" id="date" name="date" class="flex-auto" [(ngModel)]="newTrajet.date"
            autocomplete="off" required />
    </div>
    <div class="flex flex-col gap-2">
        <div class="flex items-center gap-4">
            <div class="flex align-items-center flex-auto">
                <label for="chaffeur" class="font-semibold w-24">Chauffeur</label>


                <p-select class="flex-auto" [options]="listChauffeur()" optionLabel="matricule"
                    placeholder="Choisir matricule" [(ngModel)]="selectedChauffeur" appendTo="body"
                    (onChange)="showNomPrenom($event)">
                </p-select>
            </div>
        </div>
        <span class=" text-primary  text-lg block ps-24 mb-4"> <b>{{nomPrenomChauffeur}}</b></span>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="Départ" class="font-semibold w-24">Depart</label>
        <p-select [options]="ListeVille" name="depart" placeholder="Choisir cycle" [(ngModel)]="depart" appendTo="body"
            (onChange)="calculateDistanceEvent($event)">
        </p-select>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="Destination" class="font-semibold w-24">Destination</label>
        <p-select [options]="ListeVille" name="destination" placeholder="Choisir cycle" [(ngModel)]="destination"
            appendTo="body" (onChange)="calculateDistanceEvent($event)">
        </p-select>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="kilometrage" class="font-semibold w-24">Kilometrage</label>
        <input pInputText id="kilometrage" name="kilometrage" class="flex-auto" [(ngModel)]="newTrajet.kilometrage"
            autocomplete="off" />
    </div>

    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="displayCreateDialog = false" />
        <p-button label="Save" (click)="createTrajet()" />
    </div>
</p-dialog>


<p-dialog header="Terminer un trajet" [modal]="true" [(visible)]="displayDeleteDialog" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">Voulez-vous vraiment terminer ce trajet ?</span>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="displayDeleteDialog.set(false)" />
        <p-button label="remove" (click)="removeTrajet()" severity="danger" />
    </div>
</p-dialog>}
