<h2>Gestion des trajets</h2>
<p-button label="Ajouter trajet" icon="pi pi-plus" class="p-button-success mb-3"
    (click)="displayCreateDialog=true"></p-button>
<!-- Table -->
<div class="card">
    <p-table [value]="listTrajet()" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>busId</th>
                <th>Date</th>
                <th>depart</th>
                <th>destination</th>
                <th>kilometrage</th>

                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template #body let-trajet>
            <tr>
                <td>{{ trajet.busId }}</td>
                <td>{{ trajet.date | date:'yyyy-MM-dd HH:mm'}}</td>
                <td>{{ trajet.depart}}</td>
                <td>{{ trajet.destination }}</td>
                <td>{{ trajet.kilometrage }}</td>

                <td>
                    <!-- <p-button label="Edit" icon="pi pi-pencil" class="p-button-rounded p-button-info mr-2"></p-button> -->
                    <p-button icon="pi pi-pencil" [rounded]="true" severity="info" [outlined]="true" class="mr-2"
                        (onClick)="showUpdateDialog(trajet)" />
                    <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true"
                        (onClick)="showDeleteDialog(trajet)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<!-- Dialogs -->

<p-dialog header="Ajouter un trajet" [modal]="true" [(visible)]="displayCreateDialog" [style]="{ width: '50rem' }"
    (visibleChange)="displayUpdateDialog.set($event)">
    <span class="p-text-secondary block mb-8">Update your information.</span>
    <div class="flex items-center gap-4 mb-4">
        <label for="date" class="font-semibold w-24">Date</label>
        <input pInputText type="datetime-local" id="date" class="flex-auto" [(ngModel)]="newTrajet.date"
            autocomplete="off" required />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="depart" class="font-semibold w-24">Depart</label>
        <input pInputText id="depart" class="flex-auto" [(ngModel)]="newTrajet.depart" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="destination" class="font-semibold w-24">Destination</label>
        <input pInputText id="destination" class="flex-auto" [(ngModel)]="newTrajet.destination" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="kilometrage" class="font-semibold w-24">Kilometrage</label>
        <input pInputText id="kilometrage" class="flex-auto" [(ngModel)]="newTrajet.kilometrage" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="busId" class="font-semibold w-24">busId</label>
        <input pInputText id="busId" class="flex-auto" [(ngModel)]="newTrajet.busId" autocomplete="off" />
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="displayCreateDialog = false" />
        <p-button label="Save" (click)="createTrajet()" />
    </div>
</p-dialog>

<p-dialog header="Modifier un trajet" [modal]="true" [(visible)]="displayUpdateDialog" [style]="{ width: '50rem' }">
    <span class="p-text-secondary block mb-8">Update your information.</span>
    <div class="flex items-center gap-4 mb-4">
        <label for="date" class="font-semibold w-24">Date</label>
        <input pInputText id="dat" class="flex-auto" [(ngModel)]="modtrajet.date" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="depart" class="font-semibold w-24">Depart</label>
        <input pInputText id="depart" class="flex-auto" [(ngModel)]="modtrajet.depart" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="destination" class="font-semibold w-24">Destination</label>
        <input pInputText id="destination" class="flex-auto" [(ngModel)]="modtrajet.destination" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for=" kilometrage" class="font-semibold w-24"> kilometrage</label>
        <input pInputText id=" kilometrage" class="flex-auto" [(ngModel)]="modtrajet. kilometrage" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="busId" class="font-semibold w-24">busId</label>
        <input pInputText id="busId" class="flex-auto" [(ngModel)]="modtrajet.busId" autocomplete="off" />
    </div>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="displayUpdateDialog.set(false)" />
        <p-button label="Save" (click)="updateTrajet()" />
    </div>


</p-dialog>
<!-- suprimer trajet -->
<p-dialog header="Supprimer un trajet" [modal]="true" [(visible)]="displayDeleteDialog" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-8">Voulez-vous vraiment supprimer ce trajet ?</span>
    <div class="flex justify-end gap-2">
        <p-button label="Cancel" severity="secondary" (click)="displayDeleteDialog.set(false)" />
        <p-button label="remove" (click)="removeTrajet()" severity="danger" />
    </div>
</p-dialog>
