<h2>Gestion des bus</h2>
<p-button label="Ajouter bus" icon="pi pi-plus" class="p-button-success mb-3" (click)="displayCreateDialog=true"></p-button>
<!-- Table -->
  <div class="card">
            <p-table [value]="listBus()" [tableStyle]="{ 'min-width': '50rem' }">
                <ng-template #header>
                    <tr>
                        <th>Id</th>
                        <th>Model</th>
                        <th>Fabricant</th>
                        <th>Matricule</th>
                        <th>Etat</th>
                        <th>Actions</th>
                    </tr>
                </ng-template>
                <ng-template #body let-bus>
                    <tr>
                        <td>{{ bus.id }}</td>
                        <td>{{ bus.model }}</td>
                        <td>{{ bus.fabricant }}</td>
                        <td>{{ bus.matricule }}</td>
                        <td>{{ bus.etat }}</td>
                        <td>
                            <!-- <p-button label="Edit" icon="pi pi-pencil" class="p-button-rounded p-button-info mr-2"></p-button> -->
                            <p-button icon="pi pi-pencil" [rounded]="true" severity="info" [outlined]="true" class="mr-2" (onClick)="showUpdateDialog(bus)"/>
                            <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true" (onClick)="showDleteDialog(bus)"/>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
<!-- Dialogs -->
<!-- Ajouter Bus -->

    <p-dialog header="Ajouter un bus" [modal]="true" [(visible)]="displayCreateDialog" [style]="{ width: '25rem' }">
                <span class="p-text-secondary block mb-8">Update your information.</span>
                <div class="flex items-center gap-4 mb-4">
                    <label for="mat" class="font-semibold w-24">Matricule</label>
                    <input pInputText id="mat" class="flex-auto" [(ngModel)]="newBus.matricule" autocomplete="off" />
                </div>
                <div class="flex items-center gap-4 mb-8">
                    <label for="model" class="font-semibold w-24">Model</label>
                    <input pInputText id="model" class="flex-auto" [(ngModel)]="newBus.model" autocomplete="off" />
                </div>
                <div class="flex items-center gap-4 mb-8">
                    <label for="fabricant" class="font-semibold w-24">Fabricant</label>
                    <input pInputText id="fabricant" class="flex-auto" [(ngModel)]="newBus.fabricant" autocomplete="off" />
                </div>
                <!-- <div class="flex items-center gap-4 mb-8">
                    <label for="etat" class="font-semibold w-24">Etat</label>
                    <input pInputText id="etat" class="flex-auto" [(ngModel)]="newBus.etat" autocomplete="off" />
                </div> -->
                <div class="flex justify-end gap-2">
                    <p-button label="Cancel" severity="secondary" (click)="displayCreateDialog = false" />
                    <p-button label="Save" (click)="createBus()" />
                </div>
            </p-dialog>
<!-- Modifier Bus -->
             <p-dialog header="Modifier un bus" [modal]="true" [(visible)]="displayUpdateDialog" [style]="{ width: '25rem' }">
                <span class="p-text-secondary block mb-8">Update your information.</span>
                <div class="flex items-center gap-4 mb-4">
                    <label for="mat" class="font-semibold w-24">Matricule</label>
                    <input pInputText id="mat" class="flex-auto" [(ngModel)]="modbus.matricule" autocomplete="off" />
                </div>
                <div class="flex items-center gap-4 mb-8">
                    <label for="model" class="font-semibold w-24">Model</label>
                    <input pInputText id="model" class="flex-auto" [(ngModel)]="modbus.model" autocomplete="off" />
                </div>
                <div class="flex items-center gap-4 mb-8">
                    <label for="fabricant" class="font-semibold w-24">Fabricant</label>
                    <input pInputText id="fabricant" class="flex-auto" [(ngModel)]="modbus.fabricant" autocomplete="off" />
                </div>
                <!-- <div class="flex items-center gap-4 mb-8">
                    <label for="etat" class="font-semibold w-24">Etat</label>
                    <input pInputText id="etat" class="flex-auto" [(ngModel)]="newBus.etat" autocomplete="off" />
                </div> -->
                <div class="flex justify-end gap-2">
                    <p-button label="Cancel" severity="secondary" (click)="displayUpdateDialog = false" />
                    <p-button label="Save" (click)="updateBus()" />
                </div>
            </p-dialog>

<!-- Supprimer Bus -->
             <p-dialog header="Supprimer un bus" [modal]="true" [(visible)]="displayDeleteDialog" [style]="{ width: '25rem' }">
                <span class="p-text-secondary block mb-8">Etes vbous sûr de vouloir supprimùer ce bus?</span>

                <div class="flex justify-end gap-2">
                    <p-button label="Cancel" severity="secondary" (click)="displayDeleteDialog = false" />
                    <p-button label="remove" (click)="removeBus()" severity="danger"/>
                </div>
            </p-dialog>
